<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
<defs>
<linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%"style="stop-color:#d70a53;stop-opacity:1" />
<stop offset="100%" style="stop-color:#ff4d79;stop-opacity:1" />
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
</filter>
</defs>

<!-- Background Circle (Dark terminal style) -->
<rectwidth="500" height="500" rx="110" fill="#12151c"/>

<!-- Package Box Outline -->
<path d="M120 180 L250 110 L380 180 L250 250 Z" fill="none" stroke="#2e3440" stroke-width="8" stroke-linejoin="round"/>
<path d="M120 180 L120 330 L250400 L250 250" fill="none" stroke="#2e3440" stroke-width="8" stroke-linejoin="round"/>
<path d="M380 180 L380 330 L250 400" fill="none" stroke="#2e3440" stroke-width="8" stroke-linejoin="round"/>

<!-- Glowing UP Arrow + Debian Pink Accent -->
<g filter="url(#shadow)">
<!-- Main Arrow Up -->
<path d="M250 140 L340 245 H285 V355 H215 V245 H160 Z" fill="url(#grad)"/>

<!-- GitHub Dot / Commit accent -->
<circle cx="250" cy="390" r="14" fill="#ffffff" opacity="0.9"/>
</g>
</svg>
